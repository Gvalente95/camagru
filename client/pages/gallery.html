<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camagru Gallery</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/style/index.css" />
    <link rel="stylesheet" href="/style/fx.css" />
    <link rel="stylesheet" href="/style/header.css" />
    <link rel="stylesheet" href="/style/footer.css" />
    <link rel="stylesheet" href="/style/content.css" />
    <link rel="stylesheet" href="/style/overlay.css" />
    <link rel="stylesheet" href="/style/dialog.css" />

    <link rel="stylesheet" href="/style/gallery/grid-container.css" />
    <link rel="stylesheet" href="/style/gallery/grid-controls.css" />
    <link rel="stylesheet" href="/style/gallery/cell/cell.css" />
    <link rel="stylesheet" href="/style/gallery/cell/control.css" />
    <link rel="stylesheet" href="/style/gallery/cell/delete-button.css" />

    <link rel="stylesheet" href="/style/gallery/comment-list.css" />
  </head>
  <body>
    <script src="/src/global.js"></script>
    <script src="/src/init.js"></script>
    <script src="/src/utils.js"></script>
    <script src="/src/dialog.js"></script>

    <script src="/src/gallery-page/init.js"></script>
    <script src="/src/gallery-page/global.js"></script>
    <script src="/src/gallery-page/utils.js"></script>
    <script src="/src/gallery-page/gallery/cell.js"></script>
    <script src="/src/gallery-page/gallery/comment.js"></script>
    <script src="/src/gallery-page/gallery/image.js"></script>
    <script src="/src/gallery-page/gallery/page.js"></script>
    <script src="/src/gallery-page/gallery/toggle.js"></script>

    <script src="/src/api/email.js"></script>
    <script src="/src/api/image.js"></script>
    <script src="/src/api/comment.js"></script>
    <script src="/src/api/like.js"></script>
    <script src="/src/api/session.js"></script>
    <script src="/src/api/user.js"></script>

    <script src="/src/dom/form/handler.js"></script>
    <script src="/src/dom/form/validation.js"></script>
    <script src="/src/dom/dom.js"></script>
    <script src="/src/dom/prompt.js"></script>

    <div id="notification" class="notification"></div>

    <header>
      <button class="home-button">
        <img onclick="setLocation('/')" src="/assets/icons/camagru.png" />
      </button>
      <button class="page-button" onclick="setLocation('/account')">Account</button>
      <button class="page-button" onclick="setLocation('/create')">Create</button>
      <button class="page-button selected" onclick="setLocation('/gallery')">Gallery</button>

      <div class="sign-zone">
        <button id="logout-button" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="overlay" hidden onclick="toggleOverlay(false)">
      <div class="prompt-box" id="delete-image-prompt" onclick="event.stopPropagation()">
        <div class="ftitle">Delete image?</div>
        <form
          id="delete-image-form"
          onsubmit="handleDeleteImageForm(event, this)"
          oninput="updateSubmitState(this)"
        >
          <div class="form-buttons">
            <button type="button" onclick="toggleOverlay(false)">Cancel</button>
            <button type="submit">Delete</button>
          </div>
        </form>
      </div>
    </div>

    <div class="content gallery-layout">
      <div class="main">
        <label class="empty-gallery-label" hidden>No photos yet... Be the first to make one!</label>

        <dialog class="selected-image-dialog">
          <img class="selected-image" />
        </dialog>

        <div class="grid-controls"></div>

        <div class="grid-container">
          <div class="images-grid"></div>
        </div>
      </div>
    </div>

    <footer>© 2026 Giulio Valente. All rights reserved.</footer>

    <script>
      (async () => {
        await init();
        initGallery();
      })();
    </script>
  </body>
</html>
