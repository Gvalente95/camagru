<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camagru Create</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/style/index.css" />
    <link rel="stylesheet" href="/style/fx.css" />
    <link rel="stylesheet" href="/style/header.css" />
    <link rel="stylesheet" href="/style/footer.css" />
    <link rel="stylesheet" href="/style/content.css" />
    <link rel="stylesheet" href="/style/overlay.css" />

    <link rel="stylesheet" href="/style/create/side.css" />
    <link rel="stylesheet" href="/style/create/sticker-list/header.css" />
    <link rel="stylesheet" href="/style/create/sticker-list/list.css" />
    <link rel="stylesheet" href="/style/create/sticker-list/sticker.css" />
    <link rel="stylesheet" href="/style/dialog.css" />

    <link rel="stylesheet" href="/style/create/video-container/background.css" />
    <link rel="stylesheet" href="/style/create/video-container/container.css" />
    <link rel="stylesheet" href="/style/create/video-container/flash.css" />
    <link rel="stylesheet" href="/style/create/video-container/message.css" />
    <link rel="stylesheet" href="/style/create/video-container/sticker.css" />
    <link rel="stylesheet" href="/style/create/webcam-footer/capture-button.css" />
    <link rel="stylesheet" href="/style/create/webcam-footer/upload-bg.css" />
    <link rel="stylesheet" href="/style/create/webcam-footer/video-wait-button.css" />
    <link rel="stylesheet" href="/style/create/webcam-footer/webcam-footer.css" />
  </head>
  <body>
    <script src="/src/global.js"></script>
    <script src="/src/init.js"></script>
    <script src="/src/utils.js"></script>
    <script src="/src/dialog.js"></script>

    <script src="/src/api/email.js"></script>
    <script src="/src/api/image.js"></script>
    <script src="/src/api/sticker.js"></script>
    <script src="/src/api/session.js"></script>
    <script src="/src/api/user.js"></script>

    <script src="/src/create-page/init.js"></script>
    <script src="/src/create-page/sticker.js"></script>
    <script src="/src/create-page/canvas.js"></script>
    <script src="/src/create-page/side.js"></script>
    <script src="/src/create-page/utils.js"></script>
    <script src="/src/create-page/webcam.js"></script>
    <script src="/src/create-page/global.js"></script>

    <script src="/src/dom/form/handler.js"></script>
    <script src="/src/dom/form/validation.js"></script>
    <script src="/src/dom/dom.js"></script>
    <script src="/src/dom/prompt.js"></script>

    <div id="notification" class="notification"></div>

    <header>
      <button class="home-button">
        <img onclick="setLocation('/')" src="/assets/icons/camagru.png" />
      </button>
      <button class="page-button" onclick="setLocation('/account')">Account</button>
      <button class="page-button selected" onclick="setLocation('/create')" disabled>Create</button>
      <button class="page-button" onclick="setLocation('/gallery')">Gallery</button>

      <div class="sign-zone">
        <button id="logout-button" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="overlay" hidden onclick="toggleOverlay(false)">
      <div class="prompt-box" id="delete-image-prompt" onclick="event.stopPropagation()">
        <div class="ftitle">Delete image?</div>
        <form
          id="delete-image-form"
          onsubmit="handleDeleteImageForm(event, this)"
          oninput="updateSubmitState(this)"
        >
          <div class="form-buttons">
            <button type="button" onclick="toggleOverlay(false)">Cancel</button>
            <button type="submit">Delete</button>
          </div>
        </form>
      </div>

      <div class="prompt-box" id="delete-sticker-prompt" onclick="event.stopPropagation()">
        <div class="ftitle">Delete sticker?</div>
        <form
          id="delete-sticker-form"
          onsubmit="handleDeleteStickerForm(event, this)"
          oninput="updateSubmitState(this)"
        >
          <div class="form-buttons">
            <button type="button" onclick="toggleOverlay(false)">Cancel</button>
            <button type="submit">Delete</button>
          </div>
        </form>
      </div>
    </div>

    <div class="content">
      <dialog class="selected-image-dialog">
        <img class="selected-image" />
      </dialog>

      <div class="main">
        <div class="video-container">
          <video id="webcam"></video>

          <div class="spinner-container" hidden>
            <div class="spinner black"></div>
          </div>
          <button hidden class="erase-bg-button" type="button" onclick="eraseBg()">x</button>

          <h1 class="sticker-message">Select a sticker =></h1>
          <h1 class="video-error-message" hidden>Allow camera or select a background image</h1>

          <div class="sticker-current-wrapper" hidden>
            <img class="sticker-current" />
            <img class="sticker-resizer" src="/assets/icons/resize.svg" />
          </div>

          <img class="video-background" hidden />
          <img class="flash-overlay" />

          <div class="webcam-footer">
            <div class="webcam-footer-controls">
              <input
                type="file"
                id="input-bg"
                name="input-bg"
                accept="image/png, image/jpeg"
                hidden
              />

              <label for="input-bg" class="upload-bg-button">
                <img src="assets/icons/background-image.svg" alt="Upload image" />
              </label>
            </div>

            <button class="capture-webcam-button" onclick="captureImage()" disabled>
              <img src="assets/icons/photo.svg" alt="Capture" />
            </button>

            <button onclick="togglePhotoWait()" class="video-wait-button"><div>3</div></button>
          </div>
        </div>
        <div class="sticker-list">
          <label class="sticker-list-header">
            <span>Upload</span> <span class="upload-icon"></span>
            <input
              class="upload-sticker"
              type="file"
              accept="image/png, image/jpeg"
              onchange="handleStickerCreation(this)"
            />
          </label>
        </div>
        <canvas id="snapshot" hidden></canvas>
      </div>
      <div class="side">
        <label class="side-label">No pictures yet</label>
      </div>
    </div>

    <footer>© 2026 Giulio Valente. All rights reserved.</footer>

    <script>
      (async () => {
        await init();
        initEditPage();
      })();
    </script>
  </body>
</html>
